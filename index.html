// Jam berjalan di meta-row biar berasa struk asli. Dibersihkan tiap
// render ulang / resolve biar gak numpuk banyak interval.
function wbncStartClock() {
  function tick() {
    let el = document.getElementById("wbnc-clock");
    if (!el) return;
    let d = new Date(),
      pad = n => String(n).padStart(2, "0");
    el.textContent = `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} \u00b7 ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick();
  return setInterval(tick, 1000);
}

// Login/daftar akun. Ganti anonymous sign-in lama -- resolve promise begitu
// user berhasil punya session (login atau daftar+langsung ke-session).
function showAuthGate() {
  wbncInjectAuthAssets();
  return new Promise((resolve) => {
    let mode = "login";
    let root = document.getElementById("root");
    let clockTimer = null;

    function render(msg, isError) {
      clearInterval(clockTimer);
      let title = mode === "signup" ? "DAFTAR" : "MASUK";
      let btnText = mode === "signup" ? "Daftar" : "Masuk";
      let toggleText = mode === "signup" ? "Udah punya akun? Masuk" : "Belum punya akun? Daftar";
      let msgHtml = msg ? `<p class="wbnc-msg ${isError?"err":"ok"}">${msg}</p>` : "";
      let inner = `
        <form class="wbnc-form" id="ag-form" novalidate>
          <div class="wbnc-field">
            <input id="ag-email" type="email" placeholder=" " autocomplete="email" required>
            <label for="ag-email">Email</label>
            <span class="wbnc-field__line"></span>
          </div>
          <div class="wbnc-field wbnc-field--pw">
            <input id="ag-password" type="password" placeholder=" " minlength="6" autocomplete="${mode==="signup"?"new-password":"current-password"}" required>
            <label for="ag-password">Password</label>
            <span class="wbnc-field__line"></span>
            <button type="button" class="wbnc-toggle-pw" id="ag-toggle-pw" aria-label="Tampilkan password">
              <svg class="wbnc-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="wbnc-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A9.8 9.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.3 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7c1.4 0 2.7-.3 3.9-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p class="wbnc-hint">Minimal 6 karakter</p>
          ${msgHtml}
          <button type="submit" class="wbnc-btn" id="ag-submit">
            <span class="wbnc-btn__label">${btnText}</span>
            <span class="wbnc-btn__loader" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </form>
        <p class="wbnc-footer-link"><button type="button" id="ag-toggle">${toggleText}</button></p>
      `;
      root.innerHTML = wbncTicketShell("0001", title, inner);
      clockTimer = wbncStartClock();

      let pwInput = document.getElementById("ag-password");
      let pwToggle = document.getElementById("ag-toggle-pw");
      pwToggle.onclick = () => {
        let isText = pwInput.type === "text";
        pwInput.type = isText ? "password" : "text";
        pwToggle.classList.toggle("is-visible", !isText);
      };

      document.getElementById("ag-toggle").onclick = () => {
        mode = mode === "login" ? "signup" : "login";
        render()
      };

      document.getElementById("ag-form").onsubmit = async (ev) => {
        ev.preventDefault();
        let email = document.getElementById("ag-email").value.trim();
        let password = document.getElementById("ag-password").value;
        let btn = document.getElementById("ag-submit");
        btn.disabled = true;
        btn.classList.add("is-loading");
        try {
          if (mode === "signup") {
            let {
              data,
              error
            } = await sb.auth.signUp({
              email,
              password
            });
            if (error) throw error;
            if (data.session) {
              clearInterval(clockTimer);
              resolve(data.session);
              return
            }
            mode = "login";
            render("Daftar berhasil. Cek email buat konfirmasi, abis itu masuk di sini.", false);
            return
          } else {
            let {
              data,
              error
            } = await sb.auth.signInWithPassword({
              email,
              password
            });
            if (error) throw error;
            clearInterval(clockTimer);
            resolve(data.session)
          }
        } catch (e) {
          btn.classList.remove("is-loading");
          btn.disabled = false;
          render(e.message || "Gagal, coba lagi.", true);
        }
      };
    }
    render();
  });
}

// Layar kode aktivasi. Resolve begitu redeem_activation_code sukses.
function showActivationGate() {
  wbncInjectAuthAssets();
  return new Promise((resolve) => {
    let root = document.getElementById("root");
    let clockTimer = null;

    function render(msg) {
      clearInterval(clockTimer);
      let inner = `
        <form class="wbnc-form" id="act-form" novalidate>
          <div class="wbnc-field">
            <input id="act-code" type="text" placeholder=" " autocomplete="off" style="text-transform:uppercase;letter-spacing:1px" required>
            <label for="act-code">Kode aktivasi</label>
            <span class="wbnc-field__line"></span>
          </div>
          ${msg?`<p class="wbnc-msg err">${msg}</p>`:""}
          <button type="submit" class="wbnc-btn" id="act-submit">
            <span class="wbnc-btn__label">Aktifkan</span>
            <span class="wbnc-btn__loader" aria-hidden="true"><i></i><i></i><i></i></span>
          </button>
        </form>
        <p class="wbnc-footer-link"><a href="https://wa.me/6285810431849?text=${encodeURIComponent("Halo, saya mau minta kode aktivasi WBNC POS")}" target="_blank" rel="noopener noreferrer">Minta kode aktivasi</a></p>
        <p class="wbnc-footer-link"><button type="button" id="act-logout">Keluar</button></p>
      `;
      root.innerHTML = wbncTicketShell("0002", "AKTIVASI", inner);
      clockTimer = wbncStartClock();

      document.getElementById("act-logout").onclick = async () => {
        await sb.auth.signOut();
        location.reload()
      };
      document.getElementById("act-form").onsubmit = async (ev) => {
        ev.preventDefault();
        let code = document.getElementById("act-code").value.trim().toUpperCase();
        let btn = document.getElementById("act-submit");
        btn.disabled = true;
        btn.classList.add("is-loading");
        try {
          let {
            error
          } = await sb.rpc("redeem_activation_code", {
            p_code: code
          });
          if (error) throw error;
          clearInterval(clockTimer);
          resolve();
        } catch (e) {
          btn.classList.remove("is-loading");
          btn.disabled = false;
          render(e.message || "Kode gak valid.");
        }
      };
    }
    render();
  });
}

<script type="module">
// Global layout fix: reset scroll position whenever the active page or a
// full-screen sub-page overlay changes, so a page never inherits the previous
// page's scroll offset. Purely a layout/UX patch -- no app state, routing, or
// business logic is touched.
(function(){
  function isPageRoot(node){
    return node.nodeType===1 && node.classList && (
      (node.parentElement && node.parentElement.matches && node.parentElement.matches('.no-scrollbar.flex-1.overflow-y-auto'))
      || (node.classList.contains('inset-0') && node.classList.contains('z-50'))
    );
  }
  function start(){
    var scroller=document.querySelector('.no-scrollbar.flex-1.overflow-y-auto');
    if(!scroller){requestAnimationFrame(start);return}
    var reset=function(){scroller.scrollTop=0};
    var mo=new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var added=muts[i].addedNodes;
        for(var j=0;j<added.length;j++){
          if(isPageRoot(added[j])){reset();return}
        }
      }
    });
    mo.observe(scroller,{childList:true,subtree:true});
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',start)}else{start()}
})();
</script>

  function openPanel(){ overlay.classList.add('open'); panel.classList.add('open'); renderList(); }
  function closePanel(){ overlay.classList.remove('open'); panel.classList.remove('open'); }

  var soundBtn = panel.querySelector('#wbnc-notif-sound-toggle');
  function renderSoundBtn(){
    soundBtn.textContent = notifSoundOn() ? '\uD83D\uDD0A' : '\uD83D\uDD07';
    soundBtn.setAttribute('aria-label', notifSoundOn() ? 'Suara notifikasi nyala, tap untuk matikan' : 'Suara notifikasi mati, tap untuk nyalakan');
  }
  renderSoundBtn();
  soundBtn.addEventListener('click', function(e){ e.stopPropagation(); setNotifSound(!notifSoundOn()); renderSoundBtn(); });
  // Delegation ke document (bukan bell.addEventListener langsung) biar tetep
  // nyala walau tombol bell aslinya sempet ke-remount pas pindah-pindah tab.
  document.addEventListener('click', function(e){
    if(e.target && e.target.closest && e.target.closest('#' + BELL_ID)) openPanel();
  });
  overlay.addEventListener('click', closePanel);
  panel.querySelector('#wbnc-panel-close').addEventListener('click', closePanel);

  function money(n){ return 'Rp' + Number(n || 0).toLocaleString('id-ID'); }
  function fmtWaktu(iso){
    try{ return new Date(iso).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); }
    catch(e){ return ''; }
  }
  // Kolom asli udah kekonfirmasi dari backend: transactions.address.
  // Alamat/delivery_address ditaro sbg fallback jaga-jaga jalur lain.
  function pickAddress(row){
    return row.address || row.Alamat || row.delivery_address || 'Alamat belum tersedia dari sistem';
  }

  function orderCard(o, opts){
    var itemsTxt = (o.items || []).map(function(it){ return it.qty + 'x ' + it.name; }).join(', ');
    var cls = 'wbnc-order-card' + (opts.cardClass ? ' ' + opts.cardClass : '');
    var head = opts.statusPill
      ? '<div class="row"><span class="name">' + (o.nama || 'Pelanggan') + '</span><span class="status-pill">' + opts.statusPill + '</span></div>'
      : '<div class="row"><span class="name">' + (o.nama || 'Pelanggan') + '</span><span class="total">' + money(o.total) + '</span></div>';
    var addrRow = opts.showAddress
      ? '<div class="addr">\uD83D\uDCCD <span>' + (o.alamat || 'Alamat belum tersedia dari sistem') + '</span></div>'
      : '';
    var totalRow = opts.statusPill
      ? '<div class="meta">' + itemsTxt + '</div><div class="meta">' + money(o.total) + '</div>'
      : '<div class="meta">' + (o.metode || '') + ' \u2022 ' + (o.waktu || '') + '</div><div class="meta">' + itemsTxt + '</div>';
    return '<div class="' + cls + '" data-id="' + o.id + '">' + head + addrRow + totalRow +
      '<button data-' + opts.action + '="' + o.id + '">' + opts.btnLabel + '</button></div>';
  }

  function renderList(){
    var c = client();
    if(c && !c._token()){
      listEl.innerHTML = '<div id="wbnc-login-hint">Login dulu buat lihat pesanan online masuk \uD83D\uDD11</div>';
      return;
    }
    if(pending.length === 0 && processing.length === 0 && shipping.length === 0){
      listEl.innerHTML = '<div id="wbnc-empty">Belum ada pesanan online baru \uD83D\uDC4B</div>';
      return;
    }
    var shippingDelivery = shipping.filter(function(o){ return o.deliveryType === 'delivery'; });
    var shippingPickup = shipping.filter(function(o){ return o.deliveryType !== 'delivery'; });
    var html = '';
    if(pending.length > 0){
      html += '<p class="wbnc-section-label">Pesanan Baru</p>';
      html += pending.map(function(o){
        return orderCard(o, { action: 'mark', btnLabel: 'Tandai Diproses' });
      }).join('');
    }
    if(processing.length > 0){
      html += '<p class="wbnc-section-label">Sedang Diproses</p>';
      html += processing.map(function(o){
        var lbl = o.deliveryType === 'delivery' ? 'Tandai Dikirim' : 'Tandai Siap Diambil';
        return orderCard(o, { cardClass: 'processing', action: 'ship', btnLabel: lbl });
      }).join('');
    }
    if(shippingDelivery.length > 0){
      html += '<p class="wbnc-section-label">Sedang Diantar</p>';
      html += shippingDelivery.map(function(o){
        return orderCard(o, { cardClass: 'shipping', action: 'done', btnLabel: 'Tandai Selesai', statusPill: 'Diantar', showAddress: true });
      }).join('');
    }
    if(shippingPickup.length > 0){
      html += '<p class="wbnc-section-label">Siap Diambil</p>';
      html += shippingPickup.map(function(o){
        return orderCard(o, { cardClass: 'shipping', action: 'done', btnLabel: 'Tandai Selesai', statusPill: 'Siap Diambil' });
      }).join('');
    }
    listEl.innerHTML = html;
    listEl.querySelectorAll('[data-mark]').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.disabled = true; btn.textContent = 'Memproses...';
        markProcessed(btn.getAttribute('data-mark'));
      });
    });
    listEl.querySelectorAll('[data-ship]').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.disabled = true; btn.textContent = 'Menyimpan...';
        markShipping(btn.getAttribute('data-ship'));
      });
    });
    listEl.querySelectorAll('[data-done]').forEach(function(btn){
      btn.addEventListener('click', function(){
        btn.disabled = true; btn.textContent = 'Menyimpan...';
        markDone(btn.getAttribute('data-done'));
      });
    });
  }

  function updateBadge(){
    var dot = dotEl();
    if(dot){
      // PENTING: dot.style.display = '' TIDAK bikin badge muncul -- itu cuma
      // ngosongin inline style, jadi balik lagi ke rule CSS "#wbnc-home-dot{display:none}"
      // di atas (makanya badge-nya kosong mulu walau ada pesanan masuk).
      // Harus di-set eksplisit ke 'flex' biar bener2 override.
      var newText = pending.length > 0 ? (pending.length > 9 ? '9+' : String(pending.length)) : '';
      // FIX: dot.textContent = ... SELALU bongkar-pasang child node biarpun
      // isinya sama persis (lihat spek DOM "replace all"). Node itu ada di
      // dalam document.body yang lagi diawasin resyncObserver (childList+
      // subtree), jadi tiap panggilan ini bikin observer ke-trigger lagi ->
      // observer manggil updateBadge() lagi -> nulis textContent lagi ->
      // observer ke-trigger lagi -> lomba tanpa akhir & tab jadi macet.
      // Guard di bawah ini nyegah nulis DOM kalau isinya emang gak berubah,
      // jadi rantai mutation->observer->mutation-nya keputus.
      if(dot.textContent !== newText) dot.textContent = newText;
      dot.style.display = pending.length > 0 ? 'flex' : 'none';
    }
    var bell = bellEl();
    if(bell) bell.setAttribute('aria-label', pending.length > 0 ? ('Notifikasi pesanan online, ' + pending.length + ' menunggu') : 'Notifikasi pesanan online');
  }

  function ringBell(){
    var bell = bellEl();
    if(!bell) return;
    bell.classList.remove('wbnc-ring'); void bell.offsetWidth; bell.classList.add('wbnc-ring');
  }

  // Tombol bell & titiknya ke-unmount/remount tiap pindah-pindah tab (lihat
  // catatan di atas). Tanpa ini, badge sempet "kosong" beberapa detik pas
  // balik ke Beranda karena nunggu putaran poll berikutnya. Observer ini
  // langsung nyamain badge ke state `pending` begitu elemen itu balik muncul.
  var resyncObserver = new MutationObserver(function(){
    if(dotEl()) updateBadge();
  });
  resyncObserver.observe(document.body, { childList: true, subtree: true });

  function beep(){
    try{
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.36);
    }catch(e){}
  }

  // Suara ngomong (bukan cuma nada beep) pas ada pesanan online baru masuk,
  // pake Web Speech API bawaan browser (gratis, offline, gasah nunggu file
  // audio kedownload). Kalau browser gak dukung (jarang), diem aja -- beep()
  // di atas tetep jalan duluan sbg fallback suara.
  function speakNotif(order){
    try{
      if(!window.speechSynthesis) return;
      var nama = order && order.nama ? order.nama : 'pelanggan';
      var u = new SpeechSynthesisUtterance('Hey, ada pesanan online nih! Dari ' + nama + '.');
      u.lang = 'id-ID';
      u.rate = 1;
      window.speechSynthesis.cancel(); // buang antrian lama biar gak numpuk kalo pesanan masuk beruntun
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function showToast(order){
    var t = document.createElement('div');
    t.className = 'wbnc-toast';
    t.innerHTML = '<span style="font-size:20px;line-height:1">\uD83D\uDD14</span>' +
      '<div><b>Hey, ada pesanan online nih!</b><p>' + (order.nama || 'Pelanggan') + ' \u2022 ' + money(order.total) + '</p></div>';
    t.addEventListener('click', function(){ if(t.parentNode) t.parentNode.removeChild(t); openPanel(); });
    toastWrap.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 6000);
  }

  function showSimpleToast(emoji, text){
    var t = document.createElement('div');
    t.className = 'wbnc-toast';
    t.innerHTML = '<span style="font-size:20px;line-height:1">' + emoji + '</span><div><p>' + text + '</p></div>';
    t.addEventListener('click', function(){ if(t.parentNode) t.parentNode.removeChild(t); });
    toastWrap.appendChild(t);
    setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 4500);
  }

  // Cetak struk otomatis lewat printer Bluetooth yang udah kesambung di
  // Pengaturan Printer Bluetooth (pakai koneksi yang sama, bukan bikin baru).
  // Cuma dipanggil sekali pas pesanan delivery ditandai "Diproses" (transisi
  // pertama dari "Menunggu Konfirmasi"), soalnya struk itu yang kepake kurir.
  async function autoPrintReceipt(order){
    if(printedIds.has(order.id)) return;
    printedIds.add(order.id);
    if(typeof window.btPrintReceipt !== 'function'){
      showSimpleToast('\u26A0\uFE0F', 'Diproses, tapi fitur cetak otomatis belum tersedia di app ini.');
      return;
    }
    var c = client();
    var biz = (c && c._session && c._session.business && c._session.business.name) || 'Toko';
    var paperWidth = (c && c._session && c._session.business && c._session.business.paper_width) || 48;
    var txForPrint = {
      code: order.code || ('#' + String(order.id).slice(0, 8).toUpperCase()),
      timestamp: Date.now(),
      items: (order.items || []).map(function(it){
        return { name: it.name || 'Item', qty: it.qty || 1, price: it.price || 0 };
      }),
      total: order.total || 0,
      method: order.metode || 'Online'
    };
    try{
      await window.btPrintReceipt(biz, txForPrint, paperWidth);
      showSimpleToast('\uD83D\uDDA8\uFE0F', 'Struk pesanan ' + (order.nama || '') + ' berhasil dicetak.');
    }catch(e){
      console.warn('[wbnc] gagal cetak struk otomatis:', e && e.message);
      showSimpleToast('\u26A0\uFE0F', 'Diproses, tapi gagal cetak struk otomatis (printer belum terhubung).');
    }
  }

  // Tahap 1 -> 2: "Menunggu Konfirmasi" -> "Diproses". Berlaku sama buat
  // delivery maupun pickup; cetak struk otomatis cuma jalan buat delivery.
  async function markProcessed(id){
    var c = client();
    try{
      await rawCall('pesanan.updateStatus', c._token(), { id: id, status: 'Diproses' });
      var order = pending.find(function(o){ return o.id === id; });
      pending = pending.filter(function(o){ return o.id !== id; });
      if(order){
        if(!processing.some(function(o){ return o.id === id; })) processing.unshift(order);
        if(order.deliveryType === 'delivery') autoPrintReceipt(order); // gak di-await -- gak nahan UI nunggu printer
      }
      updateBadge(); renderList();
    }catch(e){
      console.warn('[wbnc] gagal tandai diproses:', e.message);
      renderList(); // balikin tombol biar bisa dicoba lagi
    }
  }

  // Tahap 2 -> 3: "Diproses" -> "Dikirim". Status yang dikirim ke backend
  // sama persis buat delivery & pickup ("Dikirim") -- cuma label tombol &
  // tampilan kartunya yang beda (Sedang Diantar vs Siap Diambil), soalnya
  // status ini yang sebelumnya kekonfirmasi ada tapi gak pernah kepake.
  async function markShipping(id){
    var c = client();
    try{
      await rawCall('pesanan.updateStatus', c._token(), { id: id, status: 'Dikirim' });
      var order = processing.find(function(o){ return o.id === id; });
      processing = processing.filter(function(o){ return o.id !== id; });
      if(order){
        if(!shipping.some(function(o){ return o.id === id; })) shipping.unshift(order);
      }
      renderList();
    }catch(e){
      console.warn('[wbnc] gagal tandai dikirim:', e.message);
      renderList(); // balikin tombol biar bisa dicoba lagi
    }
  }

  // Tahap 3 -> 4: "Dikirim" -> "Selesai" (final). Berlaku sama buat pesanan
  // yang lagi "Sedang Diantar" maupun "Siap Diambil".
  // Status 'Selesai' dikonfirmasi cocok persis sama daftar valid di
  // pesananUpdateStatus_ (Code.gs): ['Diproses', 'Dikirim', 'Selesai',
  // 'Dibatalkan']. String exact match, case-sensitive.
  async function markDone(id){
    var c = client();
    try{
      await rawCall('pesanan.updateStatus', c._token(), { id: id, status: 'Selesai' });
      shipping = shipping.filter(function(o){ return o.id !== id; });
      renderList();
      showSimpleToast('\u2705', 'Pesanan ditandai selesai.');
    }catch(e){
      console.warn('[wbnc] gagal tandai selesai:', e.message);
      showSimpleToast('\u26A0\uFE0F', 'Gagal tandai selesai: ' + (e.message || 'error server'));
      renderList(); // balikin tombol biar bisa dicoba lagi
    }
  }

  async function poll(){
    var c = client();
    if(!c || !c._token()) return; // belum login, coba lagi putaran berikutnya

    try{
      var res = await c.from('transactions').select().eq('source', 'online').eq('status', 'Menunggu Konfirmasi');
      if(res.error) throw new Error(res.error.message);
      var rows = res.data || [];
      var freshIds = {};
      rows.forEach(function(row){
        freshIds[row.id] = true;
        var isNew = !knownIds.has(row.id);
        knownIds.add(row.id);
        var order = {
          id: row.id,
          code: row.code || null,
          nama: row.customer_name,
          items: row.transaction_items || [],
          total: row.total,
          metode: (row.delivery_type === 'delivery' ? 'Delivery' : 'Pickup') + ' \u2022 ' + (row.method === 'transfer' ? 'Transfer' : 'COD'),
          waktu: fmtWaktu(row.created_at),
          alamat: pickAddress(row),
          deliveryType: row.delivery_type
        };
        var existingIdx = pending.findIndex(function(o){ return o.id === row.id; });
        if(existingIdx === -1) pending.unshift(order); else pending[existingIdx] = order;
        if(isNew){ ringBell(); if(notifSoundOn()){ beep(); speakNotif(order); } showToast(order); }
      });
      // Buang dari daftar kalau statusnya udah berubah di tempat lain
      // (mis. diproses lewat halaman lain / perangkat lain).
      pending = pending.filter(function(o){ return freshIds[o.id]; });

      // Sinkronin "Sedang Diproses" dari data asli (status Diproses, delivery
      // MAUPUN pickup) biar tetep akurat lintas perangkat/reload -- TIDAK
      // memicu cetak ulang, cetak cuma jalan sekali pas transisi lewat
      // tombol "Tandai Diproses".
      try{
        var res2 = await c.from('transactions').select().eq('source', 'online').eq('status', 'Diproses');
        if(!res2.error){
          var pRows = res2.data || [];
          processing = pRows.map(function(row){
            var existing = processing.find(function(o){ return o.id === row.id; });
            return {
              id: row.id,
              code: row.code || (existing && existing.code) || null,
              nama: row.customer_name,
              items: row.transaction_items || [],
              total: row.total,
              metode: (row.delivery_type === 'delivery' ? 'Delivery' : 'Pickup') + ' \u2022 ' + (row.method === 'transfer' ? 'Transfer' : 'COD'),
              waktu: fmtWaktu(row.created_at),
              alamat: pickAddress(row),
              deliveryType: row.delivery_type
            };
          });
          // Jaga id yang barusan ditandai diproses di sesi ini tapi belum
          // sempet ke-refetch server (hindari kartu "Sedang Diproses" kedip
          // ilang-muncul, dan cegah cetak struk dobel kalau reload).
          processing.forEach(function(o){ printedIds.add(o.id); });
        }
      }catch(e2){ console.warn('[wbnc] sync sedang-diproses gagal:', e2.message); }

      // Sinkronin "Sedang Diantar" / "Siap Diambil" dari data asli (status
      // Dikirim, delivery MAUPUN pickup) -- sama kayak di atas, TIDAK
      // memicu cetak ulang.
      try{
        var res3 = await c.from('transactions').select().eq('source', 'online').eq('status', 'Dikirim');
        if(!res3.error){
          var dRows = res3.data || [];
          shipping = dRows.map(function(row){
            var existing = shipping.find(function(o){ return o.id === row.id; });
            return {
              id: row.id,
              code: row.code || (existing && existing.code) || null,
              nama: row.customer_name,
              items: row.transaction_items || [],
              total: row.total,
              metode: (row.delivery_type === 'delivery' ? 'Delivery' : 'Pickup') + ' \u2022 ' + (row.method === 'transfer' ? 'Transfer' : 'COD'),
              waktu: fmtWaktu(row.created_at),
              alamat: pickAddress(row),
              deliveryType: row.delivery_type
            };
          });
          shipping.forEach(function(o){ printedIds.add(o.id); });
        }
      }catch(e3){ console.warn('[wbnc] sync sedang-diantar/diambil gagal:', e3.message); }

      updateBadge();
      if(panel.classList.contains('open')) renderList();
    }catch(e){
      console.warn('[wbnc] polling pesanan online gagal:', e.message);
    }
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
})();
</script>
<script>
/* =====================================================================
   PATCH TAMBAHAN — Panel "Foto Kategori"
   =====================================================================
   Script ini DITAMBAHKAN di luar bundle React utama (gak nyentuh kode
   ter-minify di atas sama sekali). Dia numpang pakai:
   - window.AppScriptClient (class query-builder yang udah didefinisikan
     di script sebelumnya, dipakai app utama buat sb.from(...))
   - sesi login yang sama (AppScriptClient otomatis baca localStorage pas
     di-instansiasi, jadi begitu pemilik toko login di app utama, panel
     ini otomatis ikut punya akses)
   Fungsinya: pemilik toko upload 1 foto per kategori (disimpan sebagai
   base64 di tabel "categories"), lalu otomatis muncul di app order
   online (Anterin) sebagai gambar kecil di chip kategori.
   ===================================================================== */
(function () {
  'use strict';
  var APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHbBoVxEO3AnvWdyJGYOrv1A7STNYysQBZrmZ5EQwnsLZb3qxQRLWKcJF-6Prx7EB-Vg/exec";

  function waitFor(check, cb, tries) {
    tries = tries || 0;
    if (check()) return cb();
    if (tries > 150) return; // ~30 detik, nyerah kalau AppScriptClient gak pernah muncul
    setTimeout(function () { waitFor(check, cb, tries + 1); }, 200);
  }

  waitFor(function () { return !!window.AppScriptClient; }, init);

  function init() {
    var client = new window.AppScriptClient(APPSCRIPT_URL);

    // ---------- kompres foto sebelum disimpan (base64 di database) ----------
    function compressImage(file, maxSize, quality) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('Gagal baca file')); };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () { reject(new Error('File bukan gambar valid')); };
          img.onload = function () {
            var w = img.width, h = img.height;
            if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
            else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ---------- styles ----------
    var style = document.createElement('style');
    style.textContent =
      '#catphoto-fab{position:static;display:none;align-items:center;justify-content:center;' +
      'width:22px;height:22px;flex:0 0 auto;border-radius:9999px;border:none;cursor:pointer;' +
      'background:hsl(38,100%,62%);color:#1a1206;font-size:12px;line-height:1;' +
      'box-shadow:0 1px 4px rgba(0,0,0,.35);}' +
      '#catphoto-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;' +
      'display:flex;align-items:flex-end;justify-content:center;}' +
      '#catphoto-overlay.hidden{display:none;}' +
      '#catphoto-sheet{background:#17121d;color:#f2ede2;width:100%;max-width:480px;' +
      'max-height:82vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;' +
      'font-family:"Public Sans",system-ui,sans-serif;position:relative;}' +
      '#catphoto-sheet h3{margin:0 0 12px;font-size:16px;font-weight:700;}' +
      '.catphoto-row{display:flex;align-items:center;gap:12px;padding:10px 0;' +
      'border-bottom:1px solid rgba(255,255,255,.08);}' +
      '.catphoto-thumb{width:52px;height:52px;border-radius:12px;background:rgba(255,255,255,.06);' +
      'display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:22px;}' +
      '.catphoto-thumb img{width:100%;height:100%;object-fit:cover;}' +
      '.catphoto-name{flex:1;font-size:14px;font-weight:600;}' +
      '.catphoto-btn{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2);' +
      'background:transparent;color:#f2ede2;cursor:pointer;}' +
      '#catphoto-save{margin-top:14px;width:100%;padding:12px;border-radius:12px;border:none;' +
      'background:hsl(38,100%,62%);color:#1a1206;font-weight:700;font-size:14px;cursor:pointer;}' +
      '#catphoto-close{position:absolute;top:14px;right:16px;background:none;border:none;' +
      'color:#f2ede2;font-size:20px;cursor:pointer;}' +
      '#catphoto-status{font-size:12px;color:#c9c2b3;margin-top:8px;min-height:16px;}';
    document.head.appendChild(style);

    // ---------- fab + sheet ----------
    var fab = document.createElement('button');
    fab.id = 'catphoto-fab';
    fab.title = 'Foto Kategori';
    fab.type = 'button';
    fab.textContent = '\uD83D\uDDBC\uFE0F';
    // CATATAN: fab TIDAK di-append ke document.body. Dia ditempel langsung jadi
    // anak dari label "Kategori" di dalam dialog, supaya (1) posisinya beneran
    // nempel & ikut alur/scroll form (gak ngambang lagi), dan (2) fab masuk ke
    // DOM dialog jadi gak ke-block sama outside-click guard punya Radix Dialog
    // (yang bikin dia gak bisa diklik pas posisinya cuma "position:fixed" lepas).

    // ---------- cari & tempelin fab di samping tombol "+ Produk" di header list Kelola Produk ----------
    // (di-scope ke row header-nya doang, soalnya ada juga tab bottom-nav yg
    // labelnya "Produk" thok — kalo dicari global bisa salah nyantol ke situ)
    function findProdukListHeaderButton() {
      var h1s = document.querySelectorAll('h1');
      for (var i = 0; i < h1s.length; i++) {
        var h1 = h1s[i];
        if ((h1.textContent || '').trim() !== 'Kelola Produk') continue;
        var row = h1.parentElement;
        if (!row) continue;
        var btns = row.querySelectorAll('button');
        for (var j = 0; j < btns.length; j++) {
          var b = btns[j];
          if (b === fab) continue;
          if ((b.textContent || '').trim() === 'Produk') return { row: row, header: h1, btn: b };
        }
      }
      return null;
    }

    // Ambil nama kategori yg lagi kepilih di form Tambah/Edit Produk SAAT INI,
    // walau produknya belum disimpan (belum klik "Tambah Produk"). Kategori
    // disimpan terpisah di tabel "categories", jadi foto bisa langsung
    // diupload duluan tanpa nunggu produk ke-save. (Cuma kepake kalo dialog-nya
    // kebetulan lagi kebuka pas fab diklik; kalo enggak, fungsi ini balikin null
    // dan daftar kategori tetep jalan normal dari database.)
    function getLiveFormCategory() {
      var dialogs = document.querySelectorAll('[role="dialog"]');
      for (var i = 0; i < dialogs.length; i++) {
        var d = dialogs[i];
        var t = d.textContent || '';
        if (t.indexOf('Nama Produk') === -1) continue;
        if (t.indexOf('Tambah Produk') === -1 && t.indexOf('Edit Produk') === -1) continue;
        var combo = d.querySelector('button[role="combobox"]');
        if (combo) {
          var val = (combo.textContent || '').trim();
          if (val) return val;
        }
      }
      return null;
    }

    function syncFabAttach() {
      var found = findProdukListHeaderButton();
      if (!found) {
        if (fab.parentNode) fab.parentNode.removeChild(fab);
        return;
      }
      var row = found.row, header = found.header, btn = found.btn;
      if (fab.parentNode === row) return; // udah nempel bener, gak usah diapa-apain lagi
      row.style.display = 'flex';
      row.style.alignItems = 'center';
      row.style.justifyContent = 'flex-end';
      row.style.gap = '8px';
      header.style.marginRight = 'auto'; // dorong judul "Kelola Produk" tetep di kiri
      row.appendChild(fab); // masuk setelah tombol +Produk -> nempel di sampingnya
      fab.style.display = 'flex';
    }
    setInterval(syncFabAttach, 200);

    var overlay = document.createElement('div');
    overlay.id = 'catphoto-overlay';
    overlay.className = 'hidden';
    overlay.innerHTML =
      '<div id="catphoto-sheet">' +
        '<button id="catphoto-close" type="button">\u2715</button>' +
        '<h3>Foto Kategori</h3>' +
        '<div id="catphoto-list"></div>' +
        '<button id="catphoto-save" type="button">Simpan Semua</button>' +
        '<div id="catphoto-status"></div>' +
      '</div>';
    document.body.appendChild(overlay);

    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.getElementById('catphoto-close').addEventListener('click', close);
    fab.addEventListener('click', open);
    document.getElementById('catphoto-save').addEventListener('click', saveAll);

    var pending = {};       // { namaKategori: dataUrlBaru } perubahan belum tersimpan
    var existingCats = [];  // baris tabel categories saat ini { id, name, photo_base64 }

    function open() {
      overlay.classList.remove('hidden');
      loadAndRender();
    }
    function close() {
      overlay.classList.add('hidden');
      pending = {};
    }
    function setStatus(msg) {
      document.getElementById('catphoto-status').textContent = msg || '';
    }

    function loadAndRender() {
      var list = document.getElementById('catphoto-list');
      list.innerHTML = '<div style="padding:20px 0;text-align:center;color:#c9c2b3;font-size:13px;">Memuat...</div>';
      setStatus('');
      Promise.all([
        client.from('products').select(),
        client.from('categories').select()
      ]).then(function (results) {
        var prodRes = results[0], catRes = results[1];
        if (prodRes.error) throw new Error(prodRes.error.message || 'Gagal ambil produk');
        if (catRes.error) throw new Error(catRes.error.message || 'Gagal ambil kategori');

        var products = prodRes.data || [];
        existingCats = catRes.data || [];

        var names = {};
        products.forEach(function (p) { if (p.category) names[p.category] = true; });
        existingCats.forEach(function (c) { if (c.name) names[c.name] = true; });

        var liveCat = getLiveFormCategory();
        var liveCatIsDraft = !!(liveCat && !names[liveCat]);
        if (liveCat) names[liveCat] = true;

        var nameList = Object.keys(names).sort();

        if (!nameList.length) {
          list.innerHTML = '<div style="padding:20px 0;text-align:center;color:#c9c2b3;font-size:13px;">Belum ada kategori. Tambah produk dulu.</div>';
          return;
        }

        list.innerHTML = '';
        nameList.forEach(function (name) { list.appendChild(buildRow(name, name === liveCat && liveCatIsDraft)); });
      }).catch(function (err) {
        list.innerHTML = '<div style="padding:20px 0;text-align:center;color:#ff8a80;font-size:13px;">Gagal memuat: ' + (err.message || err) + '</div>';
      });
    }

    function buildRow(name, isDraft) {
      var existing = existingCats.filter(function (c) { return c.name === name; })[0];
      var row = document.createElement('div');
      row.className = 'catphoto-row';

      var thumb = document.createElement('div');
      thumb.className = 'catphoto-thumb';
      if (existing && existing.photo_base64) {
        var img = document.createElement('img');
        img.src = existing.photo_base64;
        thumb.appendChild(img);
      } else {
        thumb.textContent = '\uD83C\uDFF7\uFE0F';
      }

      var label = document.createElement('div');
      label.className = 'catphoto-name';
      label.textContent = name + (isDraft ? ' (belum disimpan)' : '');

      var btn = document.createElement('button');
      btn.className = 'catphoto-btn';
      btn.type = 'button';
      btn.textContent = 'Upload';

      var fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = 'image/*';
      fileInput.style.display = 'none';

      btn.addEventListener('click', function () { fileInput.click(); });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        setStatus('Memproses foto "' + name + '"...');
        compressImage(file, 240, 0.75).then(function (dataUrl) {
          pending[name] = dataUrl;
          thumb.innerHTML = '';
          var previewImg = document.createElement('img');
          previewImg.src = dataUrl;
          thumb.appendChild(previewImg);
          setStatus('Foto "' + name + '" siap disimpan. Klik "Simpan Semua".');
        }).catch(function (err) {
          setStatus('Gagal proses foto: ' + err.message);
        });
      });

      row.appendChild(thumb);
      row.appendChild(label);
      row.appendChild(btn);
      row.appendChild(fileInput);
      return row;
    }

    function saveAll() {
      var names = Object.keys(pending);
      if (!names.length) { setStatus('Gak ada perubahan buat disimpan.'); return; }
      setStatus('Menyimpan...');
      var okCount = 0, failCount = 0;
      var chain = Promise.resolve();
      names.forEach(function (name) {
        chain = chain.then(function () {
          var dataUrl = pending[name];
          var existing = existingCats.filter(function (c) { return c.name === name; })[0];
          var op = existing
            ? client.from('categories').update({ photo_base64: dataUrl }).eq('id', existing.id)
            : client.from('categories').insert({ name: name, photo_base64: dataUrl });
          return op.then(function (res) {
            if (res.error) failCount++; else okCount++;
          }).catch(function () { failCount++; });
        });
      });
      chain.then(function () {
        pending = {};
        setStatus(okCount + ' foto tersimpan' + (failCount ? (', ' + failCount + ' gagal') : '') + '.');
        loadAndRender();
      });
    }
  }
})();
</script>
